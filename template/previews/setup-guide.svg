<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690"><rect width="900" height="690" rx="16" fill="#f5f4f0"/><g font-family="Arial,sans-serif" fill="#242923"><text x="36" y="45" font-size="27" font-weight="bold">Your portfolio in six steps</text><text x="36" y="72" font-size="15">Illustrated workflow · no framework or build required</text><g transform="translate(36 100)"><rect width="404" height="165" rx="10" fill="#fff" stroke="#cbd0c7"/><circle cx="30" cy="30" r="17" fill="#2d5945"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13">01</text><text x="58" y="36" font-size="19" font-weight="bold">Copy the starter</text><rect x="18" y="58" width="368" height="87" rx="5" fill="#e9efe5"/><text x="30" y="87" font-size="14">Download the four files in template/</text><text x="30" y="116" font-size="14">Upload them to your own repository.</text></g><g transform="translate(460 100)"><rect width="404" height="165" rx="10" fill="#fff" stroke="#cbd0c7"/><circle cx="30" cy="30" r="17" fill="#2d5945"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13">02</text><text x="58" y="36" font-size="19" font-weight="bold">Open profile.js</text><rect x="18" y="58" width="368" height="87" rx="5" fill="#e9efe5"/><text x="30" y="87" font-size="14">Click profile.js, then the pencil icon.</text><text x="30" y="116" font-size="14">Edit the values inside quotation marks.</text></g><g transform="translate(36 290)"><rect width="404" height="165" rx="10" fill="#fff" stroke="#cbd0c7"/><circle cx="30" cy="30" r="17" fill="#2d5945"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13">03</text><text x="58" y="36" font-size="19" font-weight="bold">Add your details</text><rect x="18" y="58" width="368" height="87" rx="5" fill="#e9efe5"/><text x="30" y="87" font-size="14">name: "Your Name"</text><text x="30" y="116" font-size="14">role: "Full Stack Developer"</text></g><g transform="translate(460 290)"><rect width="404" height="165" rx="10" fill="#fff" stroke="#cbd0c7"/><circle cx="30" cy="30" r="17" fill="#2d5945"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13">04</text><text x="58" y="36" font-size="19" font-weight="bold">Add résumé and links</text><rect x="18" y="58" width="368" height="87" rx="5" fill="#e9efe5"/><text x="30" y="87" font-size="14">Upload resume.pdf beside index.html.</text><text x="30" y="116" font-size="14">Set resume: "./resume.pdf"</text></g><g transform="translate(36 480)"><rect width="404" height="165" rx="10" fill="#fff" stroke="#cbd0c7"/><circle cx="30" cy="30" r="17" fill="#2d5945"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13">05</text><text x="58" y="36" font-size="19" font-weight="bold">Choose a theme</text><rect x="18" y="58" width="368" height="87" rx="5" fill="#e9efe5"/><text x="30" y="87" font-size="14">theme: "midnight"</text><text x="30" y="116" font-size="14">Commit changes to save your edits.</text></g><g transform="translate(460 480)"><rect width="404" height="165" rx="10" fill="#fff" stroke="#cbd0c7"/><circle cx="30" cy="30" r="17" fill="#2d5945"/><text x="30" y="35" text-anchor="middle" fill="#fff" font-size="13">06</text><text x="58" y="36" font-size="19" font-weight="bold">Publish your website</text><rect x="18" y="58" width="368" height="87" rx="5" fill="#e9efe5"/><text x="30" y="87" font-size="14">Settings → Pages → Deploy from a branch</text><text x="30" y="116" font-size="14">Choose main and /(root), then Save.</text></g></g></svg>